<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Trailer Hub</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="header-container">
            <h1>Contact Us</h1>
            <p>We'd love to hear your suggestions to improve Trailer Hub!</p>
        </div>
    </header>

    <main>
        <section class="contact-info-section">
            <h2>Contact Information</h2>
            <ul class="contact-info">
                <li><strong>Email:</strong> <a href="mailto:TrailerHub@gmail.com">TrailerHub@gmail.com</a></li>
                <li><strong>Phone:</strong> <a href="tel:+78804225">78804225</a></li>
                <li><strong>Address:</strong> Hamra Street</li>
            </ul>
        </section>

        <section class="suggestions-form-section">
            <h2>Your Suggestions</h2>
            <p>Have ideas to make Trailer Hub better? Share them below:</p>
            <form id="suggestions-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="suggestion">Your Suggestion</label>
                    <textarea id="suggestion" name="suggestion" placeholder="Enter your suggestion here..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Suggestion</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <p>&copy; 2024 Trailer Hub. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
